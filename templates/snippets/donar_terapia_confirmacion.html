{% load hope_assets %}
{% include 'includes/donaciones_runtime.html' %}
<link rel="stylesheet" href="{% versioned_static 'css/invitacion_donacion.css' %}">
<dialog id="donar-terapia-confirmacion" aria-labelledby="titulo-donar-terapia" aria-describedby="descripcion-donar-terapia">
    <form method="dialog" class="donacion-cerrar">
        <button type="submit" aria-label="Cerrar invitación" autofocus>×</button>
    </form>
    <h2 id="titulo-donar-terapia">Legado de Esperanza</h2>
    <p id="descripcion-donar-terapia">Dona una terapia a una persona.<br>Apoya su tratamiento psicológico.</p>
    <div class="donacion-corazon" aria-hidden="true">🤍</div>
    <div class="donacion-cantidades" role="group" aria-label="Elige tu aportación en pesos mexicanos">
        <button type="button" data-monto="100" aria-pressed="false">$100</button>
        <button type="button" data-monto="400" aria-pressed="true">$400</button>
        <button type="button" data-monto="1200" aria-pressed="false">$1,200</button>
        <button type="button" data-monto="7200" aria-pressed="false">$7,200</button>
        <button type="button" data-monto="14500" aria-pressed="false">$14,500</button>
        <button type="button" data-monto="" aria-pressed="false">Otro</button>
    </div>
    <label class="donacion-label" for="donar-terapia-monto">Importe voluntario en MXN</label>
    <input id="donar-terapia-monto" type="number" inputmode="decimal" min="0.01" max="99999999.99" step="0.01" value="400" placeholder="Ingresa un monto" aria-describedby="donar-terapia-impacto">
    <p id="donar-terapia-impacto">“Dona un mes de terapia.”</p>
    <div id="paypal-donar-terapia"></div>
    <p id="estado-donar-terapia" role="status"></p>
</dialog>
<script src="{% versioned_static 'js/invitacion_donacion.js' %}" defer></script>
