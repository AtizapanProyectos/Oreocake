{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HOPE - Tele-Psicología PWA{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'modulo_informativo' %}" class="logo">
                <img src="{% static 'img/logo_hope_extendido.png' %}" alt="HOPE PWA Logo" class="logo-img">
            </a>
            
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <ul class="nav-menu">
                <li class="nav-item"><a href="#" class="nav-link">Inicio</a></li>
                <li class="nav-item"><a href="#" class="nav-link active">Módulo Informativo</a></li>
            </ul>
        </div>
    </nav>

    <div class="nav-spacer"></div>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 Plataforma HOPE. Oportunidad | Prevención | Esperanza.</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
