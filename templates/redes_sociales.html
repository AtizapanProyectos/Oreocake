{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOPE · Nuestro Espacio Seguro | Redes Sociales</title>
<meta name="description" content="Conecta con HOPE: Nuestro espacio seguro, nuestro espacio HOPE. Acompañamiento psicológico profesional y redes sociales oficiales.">

<!-- Favicon -->
<link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
<link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- FontAwesome 6 Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --teal:#22BFBA;
  --orange:#F5821F;
  --pink:#EC4C79;
  --yellow:#FFC72C;
  --purple:#5B4B9E;
  --purple-deep:#3B3168;
  --bg:#FBF8F2;
  --card:#FFFFFF;
  --ink:#2C2542;
  --muted:#8A82A6;
  --line:#EDE7F7;
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  min-height:100%;
}
body{
  font-family:'Nunito', system-ui, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% -5%, #FDE9D2 0%, transparent 45%),
    radial-gradient(circle at 88% 8%, #DBF5F3 0%, transparent 45%),
    radial-gradient(circle at 50% 95%, #EFEBFB 0%, transparent 50%),
    var(--bg);
  position:relative;
  overflow-x:hidden;
  padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(36px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.wrap{
  max-width:680px;
  width:100%;
  margin:0 auto;
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* Header al estilo HOPE */
header{
  margin-bottom:32px;
}
.brand-logo-wrap{
  display:inline-block;
  margin-bottom:12px;
  text-decoration:none;
  transition:transform .2s ease;
}
.brand-logo-wrap:hover{
  transform:scale(1.03);
}
.brand-logo{
  height:48px;
  width:auto;
  object-fit:contain;
  display:block;
  margin:0 auto;
}

.title-container{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  position:relative;
}
.headline-title{
  font-family:'Baloo 2', sans-serif;
  font-size:28px;
  font-weight:800;
  color:var(--purple-deep);
  line-height:1.2;
}
/* Subrayado orgánico ondulado estilo HOPE */
.wavy-underline{
  width:170px;
  height:12px;
  margin-top:2px;
  margin-bottom:8px;
  overflow:visible;
}
.headline-slogan{
  font-family:'Baloo 2', sans-serif;
  font-size:17px;
  font-weight:700;
  color:var(--orange);
}

/* =========================================================================
   BURBUJAS ESTILO HOPE: 4 DESTINOS (HOPE + 3 REDES)
   ========================================================================= */
.bubbles-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:20px;
  width:100%;
  max-width:620px;
  margin-bottom:28px;
}
@media(max-width:520px){
  .bubbles-grid{
    grid-template-columns:1fr;
    gap:16px;
  }
}

/* Tarjeta burbuja orgánica */
.bubble-card{
  background:var(--card);
  border:2.5px solid var(--line);
  border-radius:32px;
  padding:26px 20px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:inherit;
  position:relative;
  box-shadow:0 8px 24px rgba(59, 49, 104, 0.05);
  transition:transform .22s cubic-bezier(.22, 1, .36, 1), box-shadow .22s cubic-bezier(.22, 1, .36, 1), border-color .22s ease;
  overflow:hidden;
}
.bubble-card:hover{
  transform:translateY(-6px);
  box-shadow:0 16px 36px rgba(59, 49, 104, 0.11);
  border-color:var(--bubble-accent, var(--teal));
}
.bubble-card:active{
  transform:scale(0.975);
}

/* Icono dentro de burbuja circular suave */
.bubble-icon-circle{
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
  background:var(--bubble-bg, #FBF8F2);
  border:2px solid var(--bubble-border, var(--line));
  transition:transform .25s ease;
  position:relative;
}
.bubble-card:hover .bubble-icon-circle{
  transform:scale(1.08) rotate(2deg);
}

.bubble-icon-circle i{
  font-size:32px;
  color:var(--bubble-accent, var(--purple));
}
.bubble-icon-circle img{
  width:65%;
  height:65%;
  object-fit:contain;
}

/* Título con su respectivo subrayado HOPE */
.bubble-title{
  font-family:'Baloo 2', sans-serif;
  font-size:20px;
  font-weight:800;
  color:var(--purple-deep);
  line-height:1.2;
}

.bubble-underline{
  width:70px;
  height:8px;
  margin:2px 0 6px;
  overflow:visible;
}
.bubble-underline path{
  stroke:var(--bubble-accent, var(--teal));
  stroke-width:2.8;
  fill:none;
  stroke-linecap:round;
}

.bubble-desc{
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
}

/* =========================================================================
   ESTILOS Y COLORES POR RED
   ========================================================================= */

/* 1. HOPE (Sitio Web) */
.card-hope{
  --bubble-accent:var(--orange);
  --bubble-bg:#FFF7F0;
  --bubble-border:#FCD9B8;
}
.card-hope:hover{
  border-color:var(--orange);
}

/* 2. Instagram */
.card-instagram{
  --bubble-accent:#E1306C;
  --bubble-bg:#FDF0F4;
  --bubble-border:#F9C8D7;
}
.card-instagram:hover{
  border-color:#E1306C;
}

/* 3. Facebook */
.card-facebook{
  --bubble-accent:#1877F2;
  --bubble-bg:#F0F6FF;
  --bubble-border:#C5DEFF;
}
.card-facebook:hover{
  border-color:#1877F2;
}

/* 4. YouTube */
.card-youtube{
  --bubble-accent:#FF0000;
  --bubble-bg:#FFF0F0;
  --bubble-border:#FFC7C7;
}
.card-youtube:hover{
  border-color:#FF0000;
}

/* Footer limpio (0 emojis) */
footer{
  margin-top:14px;
  font-size:12.5px;
  color:var(--muted);
  line-height:1.6;
}
footer a{
  color:var(--purple);
  text-decoration:none;
  font-weight:700;
}
footer a:hover{
  text-decoration:underline;
}
</style>
</head>
<body>

<div class="wrap">

  <!-- Header -->
  <header>
    <a href="{% url 'inicio' %}" class="brand-logo-wrap" title="Ir a HOPE">
      <img src="{% static 'img/logo_hope_principal.png' %}" alt="HOPE" class="brand-logo">
    </a>
    
    <div class="title-container">
      <h1 class="headline-title">Nuestro Espacio Seguro</h1>
      <!-- Subrayado ondulado estilo HOPE -->
      <svg class="wavy-underline" viewBox="0 0 170 12" xmlns="http://www.w3.org/2000/svg">
        <path d="M 4 8 Q 45 1, 85 8 T 166 8" fill="none" stroke="var(--teal)" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <div class="headline-slogan">Nuestro espacio HOPE</div>
    </div>
  </header>

  <!-- Burbujas: Solo HOPE y las 3 Redes Sociales -->
  <main class="bubbles-grid">

    <!-- 1. HOPE: SITIO WEB -->
    <a href="{% url 'inicio' %}" class="bubble-card card-hope" title="Sitio Web Oficial de HOPE">
      <div class="bubble-icon-circle">
        <img src="{% static 'img/logo_hope_principal.png' %}" alt="HOPE">
      </div>
      <div class="bubble-title">Sitio Web</div>
      <svg class="bubble-underline" viewBox="0 0 70 8" xmlns="http://www.w3.org/2000/svg">
        <path d="M 3 5 Q 20 1, 35 5 T 67 5"/>
      </svg>
      <div class="bubble-desc">espaciohope.com</div>
    </a>

    <!-- 2. INSTAGRAM -->
    <a href="https://www.instagram.com/hope_espacio?stkn=MWdyb2E5ZXlsZmI3aw==" target="_blank" rel="noopener" class="bubble-card card-instagram" title="Instagram @hope_espacio">
      <div class="bubble-icon-circle">
        <i class="fa-brands fa-instagram"></i>
      </div>
      <div class="bubble-title">Instagram</div>
      <svg class="bubble-underline" viewBox="0 0 70 8" xmlns="http://www.w3.org/2000/svg">
        <path d="M 3 5 Q 20 1, 35 5 T 67 5"/>
      </svg>
      <div class="bubble-desc">@hope_espacio</div>
    </a>

    <!-- 3. FACEBOOK -->
    <a href="https://www.facebook.com/share/1JDcELVtwP/" target="_blank" rel="noopener" class="bubble-card card-facebook" title="Facebook Oficial HOPE">
      <div class="bubble-icon-circle">
        <i class="fa-brands fa-facebook-f"></i>
      </div>
      <div class="bubble-title">Facebook</div>
      <svg class="bubble-underline" viewBox="0 0 70 8" xmlns="http://www.w3.org/2000/svg">
        <path d="M 3 5 Q 20 1, 35 5 T 67 5"/>
      </svg>
      <div class="bubble-desc">Espacio HOPE</div>
    </a>

    <!-- 4. YOUTUBE -->
    <a href="https://youtube.com/@espaciohope?si=NYS4WimS9bRmNVMU" target="_blank" rel="noopener" class="bubble-card card-youtube" title="YouTube @espaciohope">
      <div class="bubble-icon-circle">
        <i class="fa-brands fa-youtube"></i>
      </div>
      <div class="bubble-title">YouTube</div>
      <svg class="bubble-underline" viewBox="0 0 70 8" xmlns="http://www.w3.org/2000/svg">
        <path d="M 3 5 Q 20 1, 35 5 T 67 5"/>
      </svg>
      <div class="bubble-desc">@espaciohope</div>
    </a>

  </main>

  <!-- Footer (0 emojis) -->
  <footer>
    <p>Todo lo que sientes importa, tú nos importas · <a href="{% url 'inicio' %}">HOPE</a></p>
    <p style="margin-top:4px;font-size:11.5px;opacity:0.8;">Atizapán de Zaragoza, Estado de México</p>
  </footer>

</div>

</body>
</html>
