<style>

dialog{border:0;padding:0;border-radius:34px;width:min(460px,100% - 28px);background:var(--card);color:var(--ink);box-shadow:0 30px 60px -20px rgba(30,15,90,.55)}

if(EST==='emojis')g+=em(70,100,54,pick(['👩‍⚕️','👨‍⚕️','🧑‍⚕️'],sp,0))+(u?em(170,100,54,pick(['🙂','😊','🧑','👩','👨','🧑‍🦱','👩‍🦰','👨‍🦱'],sc,2)):em(170,92,44,'⏳'));

function sala(c){var T={libre:'Libre',uso:'En uso',apartado:'Apartado'},i;
if(c.estado==='libre')i='<b>¡Todo despejado!</b><span>Listo para recibir a alguien</span>';
else if(c.estado==='uso')i='<b>'+esc(c.psi||'Psicólogo/a sin nombre')+'</b><span>con '+esc(c.cons||'consultante')+' · desde '+hh(c.desde)+' ('+hace(c.desde)+')'+(c.hasta?' · hasta '+c.hasta:'')+'</span>';
else i='<b>'+esc(c.psi||'Apartado')+'</b><span>'+(c.cons?'espera a '+esc(c.cons)+' · ':'')+'desde '+hh(c.desde)+(c.hasta?' · hasta '+c.hasta:'')+'</span>';
return '<button type="button" class="sala '+c.estado+'" data-id="'+c.id+'" aria-label="'+esc(c.nombre)+': '+T[c.estado]+'. Toca para cambiar."><span class="top"><h3>'+esc(c.nombre)+'</h3><span class="est"><i></i>'+T[c.estado]+'</span></span>'+escena(c)+'<span class="info">'+i+'</span></button>'}
function render(){var h='',n={libre:0,uso:0,apartado:0};
[['alta','Planta alta'],['baja','Planta baja']].forEach(function(p){var l=S.filter(function(c){return c.piso===p[0]});l.forEach(function(c){n[c.estado]++});
var lb=l.filter(function(c){return c.estado==='libre'}).length;
h+='<section class="piso" aria-label="'+p[1]+'"><header><h2>'+p[1]+' <small>'+lb+' libre'+(lb===1?'':'s')+' de '+l.length+'</small></h2><button type="button" class="mini" data-add="'+p[0]+'">+ Agregar consultorio</button></header><div class="salas">'+(l.map(sala).join('')||'<p style="color:var(--muted);font-weight:600">Aún no hay consultorios aquí. Agrega el primero.</p>')+'</div></section>'});
document.getElementById('pisos').innerHTML=h;document.getElementById('nL').textContent=n.libre;document.getElementById('nU').textContent=n.uso;document.getElementById('nA').textContent=n.apartado;
document.getElementById('psis').innerHTML=P.map(function(x){return '<option value="'+esc(x)+'">'}).join('')}
function ab(id){cur=S.filter(function(c){return c.id===id})[0];var d=document.getElementById('dlg');
document.getElementById('dt').textContent=cur.nombre;document.getElementById('fn').value=cur.nombre;
var e=cur.estado==='libre'?'uso':cur.estado;document.querySelector('input[name=e][value='+e+']').checked=true;
document.getElementById('fp').value=cur.psi;document.getElementById('fc').value=cur.cons;document.getElementById('fh').value=cur.hasta;ver();d.showModal()}
function ver(){var e=document.querySelector('input[name=e]:checked').value;document.getElementById('quien').style.display=e==='libre'?'none':'grid'}
function arma(b,k,txt,fn){if(armed[k]){armed[k]=0;fn();return}armed[k]=1;var o=b.textContent;b.textContent=txt;b.classList.add('armado');setTimeout(function(){armed[k]=0;b.textContent=o;b.classList.remove('armado')},3000)}
document.getElementById('pisos').addEventListener('click',function(ev){var s=ev.target.closest('.sala'),a=ev.target.closest('[data-add]');
if(s)ab(+s.dataset.id);else if(a){var id=Math.max.apply(0,S.map(function(c){return c.id}).concat(0))+1;S.push({id:id,nombre:'Consultorio '+(S.length+1),piso:a.dataset.add,estado:'libre',psi:'',cons:'',desde:0,hasta:''});save();render()}});
document.querySelectorAll('input[name=e]').forEach(function(r){r.addEventListener('change',ver)});
document.getElementById('no').onclick=function(){document.getElementById('dlg').close()};
document.getElementById('del').onclick=function(){var b=this;arma(b,'del','¿Seguro? Toca de nuevo',function(){S=S.filter(function(c){return c!==cur});save();render();document.getElementById('dlg').close()})};
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var e=document.querySelector('input[name=e]:checked').value,antes=cur.estado;
cur.nombre=document.getElementById('fn').value.trim()||cur.nombre;cur.estado=e;
if(e==='libre'){cur.psi=cur.cons=cur.hasta='';cur.desde=0}else{cur.psi=document.getElementById('fp').value.trim();cur.cons=document.getElementById('fc').value.trim();cur.hasta=document.getElementById('fh').value;if(antes==='libre'||!cur.desde)cur.desde=Date.now();
if(cur.psi&&P.indexOf(cur.psi)<0)P.push(cur.psi)}
save();render();document.getElementById('dlg').close();var pc=document.querySelector('.sala[data-id="'+cur.id+'"]');if(pc)pc.classList.add('pop')});
document.getElementById('todos').onclick=function(){arma(this,'todos','¿Seguro? Toca de nuevo',function(){S.forEach(function(c){c.estado='libre';c.psi=c.cons=c.hasta='';c.desde=0});save();render()})};
document.getElementById('frase').textContent=FR[Math.floor(Date.now()/864e5)%FR.length];
function est(){document.querySelectorAll('[data-est]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.est===EST)})}
document.querySelectorAll('[data-est]').forEach(function(b){b.onclick=function(){EST=b.dataset.est;try{localStorage.setItem('hope-estilo',EST)}catch(e){}est();render()}});
est();render();setInterval(function(){if(!document.getElementById('dlg').open)render()},30000);
