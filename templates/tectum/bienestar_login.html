{% load static %}
<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar a Tectum Bienestar</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #14203d; background: #f1f5fc; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        main { width: min(100%, 29rem); padding: clamp(24px, 7vw, 44px); background: #fff; border: 1px solid #d9e2f0; border-top: 5px solid #0c2f7c; border-radius: 18px; box-shadow: 0 18px 55px #14203d14; }
        .marcas { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .marcas img { display: block; width: min(38%, 126px); height: 48px; object-fit: contain; }
        .marcas span { width: 1px; height: 32px; background: #d9e2f0; }
        h1 { margin: 0 0 26px; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.2; }
        .campo { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-size: .95rem; font-weight: 650; }
        input, button { width: 100%; min-height: 48px; border-radius: 8px; font: inherit; }
        input { padding: 10px 12px; border: 1px solid #8594ae; color: inherit; background: #fff; }
        button { padding: 10px 18px; border: 0; color: #fff; background: #0c2f7c; font-weight: 700; cursor: pointer; }
        button:hover { background: #17469e; }
        :focus-visible { outline: 3px solid #4d74c2; outline-offset: 3px; }
        .errorlist { margin: 0 0 18px; padding: 12px; list-style: none; border-radius: 8px; color: #842222; background: #fff1f0; font-size: .9rem; }
        .campo .errorlist { margin: 7px 0 0; }
        input[aria-invalid="true"] { border-color: #a63333; }
    </style>
</head>
<body>
    <main>
        <div class="marcas">
            <img src="{% static 'img/tectum/logo-completo.png' %}" alt="Tectum">
            <span aria-hidden="true"></span>
            <img src="{% static 'img/logo_hope_extendido.png' %}" alt="Espacio HOPE">
        </div>
        <h1>Tectum Bienestar</h1>
        <form method="post" action="{% url 'panel_bienestar_tectum_login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.non_field_errors %}
                <div role="alert">{{ form.non_field_errors }}</div>
            {% endif %}
            {% for field in form %}
                <div class="campo">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
